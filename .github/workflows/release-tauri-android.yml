name: Release Tauri Android

# Optional APK-only rebuild for an existing (or new) vX.Y.Z release.
# Prefer the unified "Release Tauri" workflow for normal shipping.
# Never uses android-v* tags — those steal /releases/latest and break desktop auto-update.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver for release tag (e.g. 1.4.0). Empty = package.json version. Tag is always vX.Y.Z.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Default packages used to include legacy `tools`, which Google removed
      # from the SDK repo (sdkmanager: Failed to find package 'tools').
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version
        id: app_version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          VERSION="${VERSION#android-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Android release version $VERSION (tag v$VERSION)"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      # Debug-signed APKs for sideload (no release keystore yet).
      # split-per-abi → one APK per ABI; second build → universal (all ABIs).
      - name: Build Android APKs (per-ABI + universal, debug)
        run: |
          bunx tauri android build --debug --apk --split-per-abi
          bunx tauri android build --debug --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Collect APK artifacts
        run: bun scripts/collect-android-release-apks.mjs "${{ steps.app_version.outputs.version }}"

      - name: Upload Android APKs to unified v* GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: DocuHaim v${{ steps.app_version.outputs.version }}
          body_path: docs/desktop/github-release-body.md
          # Never steal GitHub "Latest" from a full desktop release that already has latest.json.
          make_latest: false
          prerelease: ${{ inputs.prerelease }}
          files: dist-android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
