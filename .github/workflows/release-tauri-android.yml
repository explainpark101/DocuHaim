name: Release Tauri Android

# Optional APK-only rebuild for an existing (or new) vX.Y.Z release.
# Prefer the unified "Release Tauri" workflow for normal shipping.
# Never uses android-v* tags — those steal /releases/latest and break desktop auto-update.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver for release tag (e.g. 1.4.0). Empty = package.json version. Tag is always vX.Y.Z.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Default packages used to include legacy `tools`, which Google removed
      # from the SDK repo (sdkmanager: Failed to find package 'tools').
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version
        id: app_version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION="${VERSION#v}"
          VERSION="${VERSION#android-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Android release version $VERSION (tag v$VERSION)"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      # Debug-signed APK for sideload (no release keystore yet).
      - name: Build Android APK (debug)
        run: bunx tauri android build --debug --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Collect APK artifacts
        id: apk
        shell: bash
        run: |
          mkdir -p dist-android
          VERSION="${{ steps.app_version.outputs.version }}"
          OUT="dist-android/DocuHaim_${VERSION}_universal-debug.apk"
          mapfile -d '' apks < <(find src-tauri/gen/android -type f -name '*.apk' -print0)
          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo "No APK found under src-tauri/gen/android"
            find src-tauri/gen/android -type f | head -100 || true
            exit 1
          fi
          pick=""
          for f in "${apks[@]}"; do
            if [[ "$(basename "$f")" == *universal* ]]; then
              pick="$f"
              break
            fi
          done
          if [[ -z "$pick" ]]; then
            pick="${apks[0]}"
          fi
          cp -v "$pick" "$OUT"
          ls -la dist-android

      - name: Upload Android APK to unified v* GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: DocuHaim v${{ steps.app_version.outputs.version }}
          body: |
            Android sideload APK attached to the unified `vX.Y.Z` release (same tag as DMG / NSIS / `latest.json`).

            Install on device: enable “Install unknown apps”, then open the `.apk`.

            - **Do not** use `android-v*` tags (they break `/releases/latest` for the desktop updater)
            - **Debug-signed** build (installable without a release keystore)
            - See docs/desktop/android-sideload.md
          # Never steal GitHub "Latest" from a full desktop release that already has latest.json.
          make_latest: false
          prerelease: ${{ inputs.prerelease }}
          files: dist-android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
