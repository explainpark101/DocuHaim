name: Release Tauri

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One GitHub Release per semver (vX.Y.Z): DMG + NSIS + APK + latest.json.
# Stay a draft until macOS, Windows, and Android builds all succeed, then publish.
# A failed build leaves the draft unpublished so /releases/latest stays on the previous release.
# Do not publish separate android-v* tags — they steal /releases/latest and break the updater.

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
      draft: ${{ steps.draft.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION from package.json"

      # getReleaseByTag hides drafts, so later jobs must reuse this release id.
      # GitHub cannot turn a published release back into a draft.
      - name: Create or reuse draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NAME="DocuHaim v${VERSION}"
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_JSON=true
          else
            PRERELEASE_JSON=false
          fi

          MATCHES="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"${TAG}\") | [.id, .draft] | @tsv")"

          DRAFT_ID="$(printf '%s\n' "${MATCHES}" | awk -F '\t' '
            $2 == "true" && (min == "" || $1 + 0 < min) { min = $1 + 0 }
            END { if (min != "") print min }
          ')"
          PUBLISHED_ID="$(printf '%s\n' "${MATCHES}" | awk -F '\t' '
            $2 == "false" && (min == "" || $1 + 0 < min) { min = $1 + 0 }
            END { if (min != "") print min }
          ')"

          if [[ -n "${DRAFT_ID}" ]]; then
            echo "Reusing draft release ${DRAFT_ID} for ${TAG}"
            jq -n \
              --rawfile body docs/desktop/github-release-body.md \
              --arg name "${NAME}" \
              --argjson prerelease "${PRERELEASE_JSON}" \
              '{name:$name, body:$body, draft:true, prerelease:$prerelease}' \
              | gh api --method PATCH --input - \
                "/repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" >/dev/null
            echo "release_id=${DRAFT_ID}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${PUBLISHED_ID}" ]]; then
            echo "Release ${TAG} is already published (${PUBLISHED_ID}). Uploads will update it in place."
            echo "release_id=${PUBLISHED_ID}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating draft release ${TAG}"
            CREATED="$(jq -n \
              --rawfile body docs/desktop/github-release-body.md \
              --arg tag "${TAG}" \
              --arg name "${NAME}" \
              --arg target "${GITHUB_SHA}" \
              --argjson prerelease "${PRERELEASE_JSON}" \
              '{tag_name:$tag, name:$name, body:$body, draft:true, prerelease:$prerelease, target_commitish:$target}' \
              | gh api --method POST --input - \
                "/repos/${GITHUB_REPOSITORY}/releases")"
            RELEASE_ID="$(printf '%s' "${CREATED}" | jq -r '.id')"
            if [[ -z "${RELEASE_ID}" || "${RELEASE_ID}" == "null" ]]; then
              echo "Failed to create draft release"
              printf '%s\n' "${CREATED}"
              exit 1
            fi
            echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: create-draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION from package.json"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat docs/desktop/github-release-body.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      # Secrets cannot be referenced in step `if:` — probe via env in a shell step.
      # Empty strings still trigger tauri-action import/codesign and fail.
      - name: Resolve signing mode
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          case "${{ matrix.platform }}" in
            macos-latest)
              if [[ -n "$APPLE_CERTIFICATE" ]]; then
                echo "signed=true" >> "$GITHUB_OUTPUT"
              else
                echo "signed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            windows-latest)
              if [[ -n "$WINDOWS_CERTIFICATE" ]]; then
                echo "signed=true" >> "$GITHUB_OUTPUT"
              else
                echo "signed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Resolve updater signing mode
        id: updater_signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload release (unsigned)
        if: steps.signing.outputs.signed == 'false'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: v${{ steps.app_version.outputs.version }}
          releaseName: DocuHaim v${{ steps.app_version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ needs.create-draft-release.outputs.draft == 'true' }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Build and upload release (signed macOS)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: v${{ steps.app_version.outputs.version }}
          releaseName: DocuHaim v${{ steps.app_version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ needs.create-draft-release.outputs.draft == 'true' }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Build and upload release (signed Windows)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: v${{ steps.app_version.outputs.version }}
          releaseName: DocuHaim v${{ steps.app_version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ needs.create-draft-release.outputs.draft == 'true' }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

  publish-android:
    needs: create-draft-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Default packages used to include legacy `tools`, which Google removed
      # from the SDK repo (sdkmanager: Failed to find package 'tools').
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#android-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Android release version $VERSION"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      # Debug buildType APKs signed with committed sideload keystore
      # (src-tauri/gen/android/keystore/) so in-app updates share one cert.
      # split-per-abi → one APK per ABI; second build → universal (all ABIs).
      - name: Build Android APKs (per-ABI + universal, debug)
        run: |
          bunx tauri android build --debug --apk --split-per-abi
          bunx tauri android build --debug --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Collect APK artifacts
        run: bun scripts/collect-android-release-apks.mjs "${{ steps.app_version.outputs.version }}"

      # softprops/action-gh-release looks up tags with getReleaseByTag, which
      # hides drafts and would publish a second release. Upload by release id.
      - name: Upload Android APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-android/*.apk)
          if (( ${#files[@]} == 0 )); then
            echo "No APK files found in dist-android/"
            exit 1
          fi
          UPLOAD_URL="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '.upload_url | sub("[{].*$"; "")')"
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            asset_id="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq "first(.[] | select(.name == \"${name}\") | .id) // empty")"
            if [[ -n "${asset_id}" ]]; then
              echo "Replacing existing asset ${name} (${asset_id})"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            fi
            echo "Uploading ${name}"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/vnd.android.package-archive" \
              "${UPLOAD_URL}?name=${name}" \
              --input "$f" >/dev/null
          done

  publish-release:
    needs: [create-draft-release, publish-tauri, publish-android]
    if: ${{ success() && needs.create-draft-release.outputs.draft == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${PRERELEASE}" == "true" ]]; then
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -F prerelease=true \
              -f make_latest=false >/dev/null
            echo "Published ${RELEASE_ID} as a prerelease"
          else
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true >/dev/null
            echo "Published ${RELEASE_ID}"
          fi
