name: Release Tauri

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        type: boolean
        default: false
      updater_json_only:
        description: 'Do not rebuild. Regenerate latest.json from installers already on this version release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One GitHub Release per semver (vX.Y.Z): DMG + app updater archive + NSIS + APK + latest.json.
# Build jobs only stage files. One later job uploads every installer, then writes latest.json.
# Stay a draft until that upload succeeds, then publish.
# A failed build leaves the draft unpublished so /releases/latest stays on the previous release.
# updater_json_only skips builds and replaces latest.json on the existing vX.Y.Z release.
# Do not publish separate android-v* tags — they steal /releases/latest and break the updater.

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
      draft: ${{ steps.draft.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION from package.json"

      # getReleaseByTag hides drafts, so later jobs must reuse this release id.
      # GitHub cannot turn a published release back into a draft.
      - name: Create or reuse draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          UPDATER_JSON_ONLY: ${{ inputs.updater_json_only }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NAME="DocuHaim v${VERSION}"
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_JSON=true
          else
            PRERELEASE_JSON=false
          fi

          MATCHES="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"${TAG}\") | [.id, .draft] | @tsv")"

          DRAFT_ID="$(printf '%s\n' "${MATCHES}" | awk -F '\t' '
            $2 == "true" && (min == "" || $1 + 0 < min) { min = $1 + 0 }
            END { if (min != "") print min }
          ')"
          PUBLISHED_ID="$(printf '%s\n' "${MATCHES}" | awk -F '\t' '
            $2 == "false" && (min == "" || $1 + 0 < min) { min = $1 + 0 }
            END { if (min != "") print min }
          ')"

          if [[ "${UPDATER_JSON_ONLY}" == "true" && -z "${DRAFT_ID}" && -z "${PUBLISHED_ID}" ]]; then
            echo "updater_json_only: no release found for ${TAG}. Refusing to create one."
            exit 1
          fi

          if [[ -n "${DRAFT_ID}" ]]; then
            echo "Reusing draft release ${DRAFT_ID} for ${TAG}"
            # Omit tag_name and GitHub clears it on a draft. tauri-action then
            # misses this release, creates another draft, and latest.json lands
            # on the copy while publish still targets this id.
            jq -n \
              --rawfile body docs/desktop/github-release-body.md \
              --arg tag "${TAG}" \
              --arg name "${NAME}" \
              --argjson prerelease "${PRERELEASE_JSON}" \
              '{tag_name:$tag, name:$name, body:$body, draft:true, prerelease:$prerelease}' \
              | gh api --method PATCH --input - \
                "/repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" >/dev/null
            echo "release_id=${DRAFT_ID}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${PUBLISHED_ID}" ]]; then
            echo "Release ${TAG} is already published (${PUBLISHED_ID}). Uploads will update it in place."
            echo "release_id=${PUBLISHED_ID}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating draft release ${TAG}"
            CREATED="$(jq -n \
              --rawfile body docs/desktop/github-release-body.md \
              --arg tag "${TAG}" \
              --arg name "${NAME}" \
              --arg target "${GITHUB_SHA}" \
              --argjson prerelease "${PRERELEASE_JSON}" \
              '{tag_name:$tag, name:$name, body:$body, draft:true, prerelease:$prerelease, target_commitish:$target}' \
              | gh api --method POST --input - \
                "/repos/${GITHUB_REPOSITORY}/releases")"
            RELEASE_ID="$(printf '%s' "${CREATED}" | jq -r '.id')"
            if [[ -z "${RELEASE_ID}" || "${RELEASE_ID}" == "null" ]]; then
              echo "Failed to create draft release"
              printf '%s\n' "${CREATED}"
              exit 1
            fi
            echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: create-draft-release
    if: ${{ inputs.updater_json_only != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION from package.json"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      # Secrets cannot be referenced in step `if:` — probe via env in a shell step.
      # Empty strings still trigger tauri-action import/codesign and fail.
      - name: Resolve signing mode
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          case "${{ matrix.platform }}" in
            macos-latest)
              if [[ -n "$APPLE_CERTIFICATE" ]]; then
                echo "signed=true" >> "$GITHUB_OUTPUT"
              else
                echo "signed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            windows-latest)
              if [[ -n "$WINDOWS_CERTIFICATE" ]]; then
                echo "signed=true" >> "$GITHUB_OUTPUT"
              else
                echo "signed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Resolve updater signing mode
        id: updater_signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Build only. Uploading here races across macOS, Windows, and Android and
      # leaves the release with whichever job finished last.
      - name: Build Tauri bundles (unsigned)
        if: steps.signing.outputs.signed == 'false'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Build Tauri bundles (signed macOS)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Build Tauri bundles (signed Windows)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Stage desktop installers
        shell: bash
        run: bun scripts/publishReleaseAssets.ts stage --from src-tauri/target --to dist-desktop

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-desktop-${{ matrix.platform }}
          path: dist-desktop/*
          if-no-files-found: error

  publish-android:
    needs: create-draft-release
    if: ${{ inputs.updater_json_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Default packages used to include legacy `tools`, which Google removed
      # from the SDK repo (sdkmanager: Failed to find package 'tools').
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#android-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Android release version $VERSION"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      # Debug buildType APKs signed with committed sideload keystore
      # (src-tauri/gen/android/keystore/) so in-app updates share one cert.
      # split-per-abi → one APK per ABI; second build → universal (all ABIs).
      # The universal build can wipe earlier outputs, so ABI APKs are copied aside first.
      - name: Build Android APKs (per-ABI + universal, debug)
        shell: bash
        run: |
          set -euo pipefail
          bunx tauri android build --debug --apk --split-per-abi
          mkdir -p "$RUNNER_TEMP/apk-abi"
          mapfile -t abi_apks < <(find src-tauri/gen/android -type f -name 'app-*-debug.apk' ! -name 'app-universal-debug.apk')
          if (( ${#abi_apks[@]} == 0 )); then
            echo "split-per-abi produced no ABI APKs"
            exit 1
          fi
          cp "${abi_apks[@]}" "$RUNNER_TEMP/apk-abi/"
          bunx tauri android build --debug --apk
          mkdir -p src-tauri/gen/android/preserved-abi-apks
          cp "$RUNNER_TEMP/apk-abi/"*.apk src-tauri/gen/android/preserved-abi-apks/
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Collect APK artifacts
        run: bun scripts/collect-android-release-apks.mjs "${{ steps.app_version.outputs.version }}"

      - name: Upload Android installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: dist-android/*.apk
          if-no-files-found: error

  attach-release-assets:
    needs: [create-draft-release, publish-tauri, publish-android]
    if: ${{ !cancelled() && inputs.updater_json_only != true && needs.publish-tauri.result == 'success' && needs.publish-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download every installer
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Upload every installer and latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/publishReleaseAssets.ts upload \
            --dir release-assets \
            --release-id "${{ needs.create-draft-release.outputs.release_id }}" \
            --version "${{ needs.create-draft-release.outputs.version }}" \
            --notes docs/desktop/github-release-body.md

  refresh-updater-json:
    needs: create-draft-release
    if: ${{ inputs.updater_json_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate latest.json only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/publishReleaseAssets.ts json-only \
            --release-id "${{ needs.create-draft-release.outputs.release_id }}" \
            --version "${{ needs.create-draft-release.outputs.version }}" \
            --notes docs/desktop/github-release-body.md

  publish-release:
    needs: [create-draft-release, attach-release-assets]
    if: ${{ !cancelled() && inputs.updater_json_only != true && needs.create-draft-release.outputs.draft == 'true' && needs.attach-release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          VERSION: ${{ needs.create-draft-release.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | .name' | grep -qx 'latest.json'; then
            echo "Refusing to publish release ${RELEASE_ID}: latest.json is missing."
            echo "Leaving the release as a draft so /releases/latest is unchanged."
            exit 1
          fi
          TAG="v${VERSION}"
          if [[ "${PRERELEASE}" == "true" ]]; then
            MAKE_LATEST=false
          else
            MAKE_LATEST=true
          fi
          # tag_name must be sent again. A publish PATCH that omits it can
          # detach the tag and leave an untagged Latest without latest.json.
          jq -n \
            --arg tag "${TAG}" \
            --arg make_latest "${MAKE_LATEST}" \
            --argjson prerelease "$([[ "${PRERELEASE}" == "true" ]] && echo true || echo false)" \
            '{tag_name:$tag, draft:false, prerelease:$prerelease, make_latest:$make_latest}' \
            | gh api --method PATCH --input - \
              "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" >/dev/null
          echo "Published ${RELEASE_ID} (${TAG})"
