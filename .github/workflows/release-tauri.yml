name: Release Tauri

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One GitHub Release per semver (vX.Y.Z): DMG + NSIS + APK + latest.json.
# Do not publish separate android-v* tags — they steal /releases/latest and break the updater.

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION from package.json"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat docs/desktop/github-release-body.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      # Secrets cannot be referenced in step `if:` — probe via env in a shell step.
      # Empty strings still trigger tauri-action import/codesign and fail.
      - name: Resolve signing mode
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          case "${{ matrix.platform }}" in
            macos-latest)
              if [[ -n "$APPLE_CERTIFICATE" ]]; then
                echo "signed=true" >> "$GITHUB_OUTPUT"
              else
                echo "signed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            windows-latest)
              if [[ -n "$WINDOWS_CERTIFICATE" ]]; then
                echo "signed=true" >> "$GITHUB_OUTPUT"
              else
                echo "signed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Resolve updater signing mode
        id: updater_signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload release (unsigned)
        if: steps.signing.outputs.signed == 'false'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: v${{ steps.app_version.outputs.version }}
          releaseName: DocuHaim v${{ steps.app_version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Build and upload release (signed macOS)
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: v${{ steps.app_version.outputs.version }}
          releaseName: DocuHaim v${{ steps.app_version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Build and upload release (signed Windows)
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: v${{ steps.app_version.outputs.version }}
          releaseName: DocuHaim v${{ steps.app_version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

  publish-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Default packages used to include legacy `tools`, which Google removed
      # from the SDK repo (sdkmanager: Failed to find package 'tools').
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version from package.json
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#android-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Android release version $VERSION"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      # Debug-signed APKs for sideload (no release keystore yet).
      # split-per-abi → one APK per ABI; second build → universal (all ABIs).
      - name: Build Android APKs (per-ABI + universal, debug)
        run: |
          bunx tauri android build --debug --apk --split-per-abi
          bunx tauri android build --debug --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Collect APK artifacts
        run: bun scripts/collect-android-release-apks.mjs "${{ steps.app_version.outputs.version }}"

      - name: Upload Android APKs to unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: DocuHaim v${{ steps.app_version.outputs.version }}
          body_path: docs/desktop/github-release-body.md
          prerelease: ${{ inputs.prerelease }}
          files: dist-android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
