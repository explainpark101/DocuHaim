name: Release Tauri

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve version from package.json
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using version $VERSION from package.json"
          bun run sync:tauri-version

      - name: Generate Tauri icons
        run: bunx tauri icon public/pwa-512x512.png -o src-tauri/icons

      # Pass signing env only when the matching platform secret exists.
      # Empty strings still trigger tauri-action import/codesign and fail.
      - name: Build and upload release (unsigned)
        if: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE == '' || matrix.platform == 'windows-latest' && secrets.WINDOWS_CERTIFICATE == '' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: DocuHaim v${{ env.VERSION }}
          releaseBody: |
            Desktop builds (DMG / NSIS).

            - macOS: universal DMG
            - Windows: NSIS installer (.exe)

            Unsigned builds if signing secrets are not configured — see docs/desktop/code-signing.md.
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Build and upload release (signed macOS)
        if: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE != '' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: DocuHaim v${{ env.VERSION }}
          releaseBody: |
            Desktop builds (DMG / NSIS).

            - macOS: universal DMG
            - Windows: NSIS installer (.exe)

            Unsigned builds if signing secrets are not configured — see docs/desktop/code-signing.md.
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Build and upload release (signed Windows)
        if: ${{ matrix.platform == 'windows-latest' && secrets.WINDOWS_CERTIFICATE != '' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: DocuHaim v${{ env.VERSION }}
          releaseBody: |
            Desktop builds (DMG / NSIS).

            - macOS: universal DMG
            - Windows: NSIS installer (.exe)

            Unsigned builds if signing secrets are not configured — see docs/desktop/code-signing.md.
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
