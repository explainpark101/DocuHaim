name: Electron Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Release 자산 업로드에 contents: write 필요. job만 write로 두면 워크플로의 read 한도를 넘지 못함.
permissions:
  contents: write

concurrency:
  group: electron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            slug: mac
          - os: ubuntu-latest
            slug: linux
          - os: windows-latest
            slug: win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Build desktop app
        run: bun run build:app
        env:
          CI: true
          # 서명 인증서 없을 때 mac에서 불필요한 탐색 생략
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.slug }}
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: electron-*
          merge-multiple: true

      - name: List downloaded files
        run: find release-assets -type f -print || (echo "::error::release-assets 비어 있음" && ls -laR && exit 1)

      - name: Publish GitHub Release with build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::업로드할 파일이 없습니다."
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          printf 'Uploading %s file(s):\n' "${#assets[@]}"
          printf ' - %s\n' "${assets[@]}"
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${assets[@]}" --generate-notes --repo "$REPO"
          fi
