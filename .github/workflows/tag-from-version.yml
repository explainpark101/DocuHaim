name: Tag from package.json version

# package.json의 version 필드에 맞춰 v{version} 태그를 만들고 push합니다.
# 태그 push → electron.yml 이 데스크톱 빌드·Release 를 실행합니다.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: tag-from-package-json
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether version changed (push only)
        id: version_diff
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          CUR=$(jq -r .version package.json)
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current=$CUR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(git show "${BEFORE}:package.json" 2>/dev/null | jq -r .version || echo "")
          if [ "$PREV" != "$CUR" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"

      - name: Read version (workflow_dispatch)
        id: version_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          CUR=$(jq -r .version package.json)
          echo "current=$CUR" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CUR="${{ steps.version_dispatch.outputs.current }}"
          else
            if [ "${{ steps.version_diff.outputs.changed }}" != "true" ]; then
              echo "package.json 의 version 이 이전 커밋과 같아 태그를 만들지 않습니다."
              exit 0
            fi
            CUR="${{ steps.version_diff.outputs.current }}"
          fi

          TAG="v${CUR}"
          if [ -z "$CUR" ] || [ "$CUR" = "null" ]; then
            echo "package.json version 을 읽을 수 없습니다."
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "원격에 이미 ${TAG} 가 있어 건너뜁니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "Pushed tag ${TAG}"
