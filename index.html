    <style>
      /* Boot splash: paints before module CSS/JS (no Tailwind). */
      html, body {
        margin: 0;
        min-height: 100%;
        background: #f8fafc;
        color: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background: #0f172a;
          color: #94a3b8;
        }
      }
      #boot-splash {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        user-select: none;
      }
      #boot-splash .boot-splash-icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash .boot-splash-icon {
          box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        }
      }
      #boot-splash .boot-splash-title {
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash .boot-splash-title {
          color: #f1f5f9;
        }
      }
      #boot-splash .boot-splash-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-height: 1.25rem;
        max-width: min(92vw, 28rem);
      }
      #boot-splash .boot-splash-spinner {
        width: 1rem;
        height: 1rem;
        border: 2px solid rgba(100, 116, 139, 0.28);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      #boot-splash .boot-splash-status {
        font-size: 0.875rem;
        line-height: 1.35;
        opacity: 0.95;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #boot-splash .boot-splash-bar {
        width: min(92vw, 16rem);
        height: 0.35rem;
        border-radius: 999px;
        background: rgba(100, 116, 139, 0.22);
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash .boot-splash-bar {
          background: rgba(148, 163, 184, 0.22);
        }
      }
      #boot-splash .boot-splash-bar-fill {
        height: 100%;
        width: 4%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, #0ea5e9);
        transition: width 0.25s ease-out;
      }
      #boot-splash .boot-splash-detail {
        font-size: 0.75rem;
        opacity: 0.75;
        min-height: 1em;
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash-spinner {
          animation: none;
          border-top-color: rgba(100, 116, 139, 0.5);
        }
        #boot-splash .boot-splash-bar-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
        <img class="boot-splash-icon" src="/vite.svg" width="72" height="72" alt="" />
        <div class="boot-splash-title">DocuHaim</div>
        <div class="boot-splash-row">
          <div class="boot-splash-spinner" aria-hidden="true"></div>
          <div id="boot-splash-status" class="boot-splash-status">앱을 준비하는 중…</div>
        </div>
        <div
          id="boot-splash-bar"
          class="boot-splash-bar"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="4"
          aria-label="로딩 진행률"
        >
          <div id="boot-splash-bar-fill" class="boot-splash-bar-fill"></div>
        </div>
        <div id="boot-splash-detail" class="boot-splash-detail"></div>
      </div>
    </div>
    <!--
      SharedArrayBuffer / lucivy-wasm: GitHub Pages cannot set COOP/COEP headers.
      coi-serviceworker (https://github.com/gzuidhof/coi-serviceworker) registers a
      same-origin SW that stamps those headers, then reloads once.
      Must stay a classic script (not bundled). Desktop builds strip this via Vite.
    -->
    <script>
      window.coi = {
        // Prefer credentialless so S3/presigned images without CORP still load.
        coepCredentialless: () => true,
        // Skip when Vite already sends COOP/COEP, or when running inside Tauri
        // (COI SW reload loops break WKWebView module loading: "Importing a module failed").
        shouldRegister: () =>
          typeof window !== 'undefined' &&
          window.crossOriginIsolated === false &&
          !('__TAURI_INTERNALS__' in window) &&
          !('__TAURI__' in window),
        quiet: false,
      };
    </script>
    <script src="./coi-serviceworker.js"></script>
    <!-- Early boot is injected at build time as a separate small entry (see bootManifestPlugin). -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
