<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>S3 Haim OG</title>
    <style>
      @font-face {
        font-family: 'A2z';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-7Bold.woff2')
          format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: 'Paperozi';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2')
          format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #23272e;
      }

      .frame {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #23272e;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 40px;
      }

      .icon {
        width: 176px;
        height: 176px;
        flex-shrink: 0;
      }

      .text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .title {
        font-family: A2z, sans-serif;
        font-weight: 700;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #d7dae0;
        white-space: nowrap;
      }

      .desc {
        font-family: Paperozi, sans-serif;
        font-weight: 400;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0.06em;
        color: #7f848e;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="lockup">
        <img class="icon" src="../public/vite.svg" alt="" />
        <div class="text">
          <div class="title">S3 Haim</div>
          <div class="desc">Markdown Notes &amp; Memo Chat</div>
        </div>
      </div>
    </div>
  </body>
</html>
