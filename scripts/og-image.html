<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Docu Haim OG</title>
    <style>
      @font-face {
        font-family: 'A2z';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-7Bold.woff2')
          format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: 'Paperozi';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2')
          format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #23272e;
        --size: 15rem;

      }

      .frame {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Tight margins — lockup nearly fills the canvas */
        background: #23272e;
      }

      .lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        width: 100%;
        max-width: 1160px;
      }

      .icon {
        width: var(--size);
        height: var(--size);
        flex-shrink: 0;
        /* Match main empty-state dark glow (sky-400) */
        filter:
          drop-shadow(0 0 18px rgba(56, 189, 248, 0.55))
          drop-shadow(0 0 36px rgba(56, 189, 248, 0.3));
      }

      .text {
        display: flex;
        flex: 0 0 auto;
        width: max-content;

        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 14px;
        min-width: 0;
        font-size: calc(var(--size) * 0.2);
      }

      .title {
        font-family: A2z, sans-serif;
        font-weight: 700;
        font-size: 3.1em;
        line-height: 0.92;
        letter-spacing: -0.02em;
        color: #d7dae0;
        white-space: nowrap;
      }

      .desc {
        font-family: Paperozi, sans-serif;
        font-weight: 400;
        font-size: 1em;
        line-height: 1.1;
        letter-spacing: 0.05em;
        color: #7f848e;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="lockup">
        <img class="icon" src="../public/vite.svg" alt="" />
        <div class="text">
          <div class="title">Docu Haim</div>
          <div class="desc">Markdown Notes &amp; Memo Chat</div>
        </div>
      </div>
    </div>
  </body>
</html>
