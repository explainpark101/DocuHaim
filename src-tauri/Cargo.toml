[package]
name = "docuhaim"
version = "1.6.1"
description = "DocuHaim desktop shell"
authors = ["Jaehyung Park"]
edition = "2021"

[lib]
name = "docuhaim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tauri-plugin-stronghold = "2"
rust-argon2 = "2"
getrandom = "0.3"

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-biometry = "0.2.8"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# RUSTSEC-2024-0429: glib 0.18.5 VariantStrIter UB — upstream EOL, no 0.18.6 on crates.io.
# Backport merged on gtk-rs-core 0.18 branch (PR #2009).
[patch.crates-io]
glib = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "4c95ab7fbc92dcb7d4adeee2613c68513e9f13e8", package = "glib" }
