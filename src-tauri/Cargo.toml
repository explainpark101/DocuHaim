[package]
name = "docuhaim"
version = "1.0.0"
description = "DocuHaim desktop shell"
authors = ["Jaehyung Park"]
edition = "2021"

[lib]
name = "docuhaim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
