<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="doc-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="small-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#dots)"/>

  <g filter="url(#shadow)" transform="translate(16, 8)">
    <path d="M 136 100 C 136 88.95 144.95 80 156 80 L 306 80 L 376 150 L 376 412 C 376 423.05 367.05 432 356 432 L 156 432 C 144.95 432 136 423.05 136 412 Z" fill="url(#doc-white)"/>
    <path d="M 306 80 L 306 130 C 306 141.05 314.95 150 326 150 L 376 150 Z" fill="url(#fold-grad)" filter="url(#small-shadow)"/>
  </g>

  <rect x="196" y="148" width="100" height="12" rx="6" fill="#38BDF8"/>
  <rect x="196" y="178" width="140" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="196" y="204" width="110" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="196" y="230" width="130" height="10" rx="5" fill="#CBD5E1"/>

  <g transform="translate(212, 272) scale(1.2)">
    <path d="M 0 0 V 40 H 10 V 15 L 25 30 L 40 15 V 40 H 50 V 0 H 40 L 25 15 L 10 0 Z" fill="#475569"/>
    <path d="M 65 0 V 25 H 55 L 75 45 L 95 25 H 85 V 0 Z" fill="#475569"/>
  </g>
